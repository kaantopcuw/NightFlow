spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_TICKET:nightflow_ticket}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8093

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.nightflow.ticketservice.config: DEBUG

# Note: there used to be a `feign.client.config.*` block here declaring the
# internal-secret RequestInterceptor. It was dead twice over - Spring Cloud
# renamed the prefix to `spring.cloud.openfeign.client.config.*` in 2022.0, and
# one of the two entries named a client (`event-catalog-client-direct`) that
# never existed. The interceptor is wired through
# `@FeignClient(configuration = FeignClientConfig.class)` instead.
