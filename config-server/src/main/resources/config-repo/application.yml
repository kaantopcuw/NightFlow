springdoc:
  api-docs:
    path: /api-docs

eureka:
  instance:
    # In containers (Docker/Kubernetes) the pod/container IP is routable while the
    # hostname is not, so deployments set EUREKA_PREFER_IP_ADDRESS=true.
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

# Security - Internal secret for service-to-service communication
security:
  internal:
    secret: ${INTERNAL_SECRET:dev-internal-secret-change-in-production}
